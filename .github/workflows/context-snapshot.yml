name: Context snapshot (PR only)
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: context-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update only metadata snapshot on bot-owned branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin automation/context-snapshot >/dev/null; then
            git fetch origin automation/context-snapshot
            git switch --track -c automation/context-snapshot origin/automation/context-snapshot
            git merge --no-edit origin/main
          else
            git switch -c automation/context-snapshot
          fi
          python3 scripts/sync_context.py --write
          python3 scripts/sync_context.py --check
          if git diff --quiet -- docs/AUTO_CONTEXT.json docs/AUTO_CONTEXT.md; then
            echo "NO_DIFF: no update necessary"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUTO_CONTEXT.json docs/AUTO_CONTEXT.md
          git commit -m "chore(context): refresh observed upstream commits"
          git push origin HEAD:refs/heads/automation/context-snapshot
          if [ -z "$(gh pr list --head automation/context-snapshot --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --head automation/context-snapshot --base main --title "chore(context): observed upstream changes" --body "Automated GitHub metadata only. Review source deltas before updating narrative, product scope, Donor/Golden or code. Do not mistake SHA change for CI/device verification."
          fi

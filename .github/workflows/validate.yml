name: Validate context contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline context checks
        run: |
          python3 scripts/sync_context.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m json.tool automation/SOURCES.json >/dev/null
